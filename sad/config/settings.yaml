app:

  name: Regulatory Monitor
  version: 1.1

logging:

  level: INFO
  file: logs/regulatory_monitor.log

database:

  engine: sqlite
  path: data/state.db

crawler:

  timeout_s: 30
  max_retries: 3
  verify_ssl: true
  user_agent: >
    RegulatoryMonitor/1.0
    (+https://company.internal)

storage:

  snapshots_dir: data/snapshots
  cache_dir: data/cache
  reports_dir: data/reports

monitoring:

  lookback_days: 30

  detect:
    new_publications: true
    modified_publications: true
    removed_publications: true

classification:

  min_confidence: 0.60

ai:

  # OpenAI-compatible chat completions endpoint used to summarise changes.
  # The API key is read from the environment, never from this file.
  enabled: true
  base_url: https://api.openai.com/v1
  model: gpt-4o-mini
  api_key_env: OPENAI_API_KEY
  timeout_s: 90
  max_body_chars: 12000
  max_output_tokens: 400
  temperature: 0.2

reporting:

  generate_excel: true
  generate_html: true

  output_filename: regulatory_report

  include_removed: true
