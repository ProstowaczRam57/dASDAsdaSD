# Typ działania regulacyjnego (pierwsze dopasowanie wygrywa)

action_types:

  enacted_law:
    [enacted, enters into force, effective date, adopted law, enacted regulation, obowiązuje, wchodzi w życie]

  proposed_rule:
    [proposed rule, draft regulation, consultation, public comment, call for feedback, NPRM, projekt, konsultacj*]

  guidance:
    [guidance, FAQ, interpretation, implementation notice, technical notice, guideline*, wytyczn*]

  scope_change:
    [scope change, threshold, exemption, reporting requirement, monitoring requirement, permit requirement, deadline extension, derogation, phase-in, phase-out]

  substance_update:
    [substance added, new restriction, classification update, exposure limit, concentration limit, PFAS restriction, hazard classification]

  enforcement:
    [enforcement, inspection, penalty, penalties, fined, settlement, citation, sanction, kara, kary, mandat, grzywna]

  postponement:
    [postponement, delayed implementation, extension, derogation, suspension, odroczenie]

  amendment:
    [amend*, revis*, update*, modification, nowelizacj*, zmiana]
