# Lista monitorowanych źródeł.
# type: rss   -> kanał RSS/Atom
#       json  -> API JSON (items_path + fields)
#       html  -> lista elementów na stronie (selektory CSS; "selektor@atrybut" pobiera atrybut)
#       page  -> brak listy; śledzimy zmiany tekstu całej strony (diff)
# state: kod stanu USA (np. CA) lub null dla źródeł federalnych / spoza USA.
#
# UWAGA: adresy i selektory CSS poniżej są punktem startowym – zweryfikuj je
# na żywych stronach (struktura HTML się zmienia) i dostosuj do swoich źródeł.
    # przy pierwszym runie źródła raportuj tylko publikacje z ostatnich N dni
monitoring:

  lookback_days: 30

request_delay_s: 2.0   # przerwa między requestami (grzeczność wobec serwerów)

# Regulatory Monitoring Sources
# type:
#   page  -> monitor page content + links + subpages
#
# state:
#   US state code
#
# compare_mode:
#   content_hash -> compare extracted content between runs
default_tracking:
  compare_mode: content_hash
  extract_links: true
  follow_subpages: true
  max_subpages: 50

sources:

